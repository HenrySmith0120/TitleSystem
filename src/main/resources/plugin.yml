name: TitleSystem
main: com.henry.title.TitleSystem
version: '${project.version}'
api-version: '1.21.8'

# 运行时依赖（Paper libraries 机制，1.19.3+）：
# 插件 jar 不打包这些库，Paper 启动时会自动解析并下载一次，
# 缓存到服务端根目录 libraries/ 文件夹（Maven 目录结构），之后可离线启动。
# 完全离线部署：预先将对应 jar 放入
#   <服务端>/libraries/<groupId>/<artifactId>/<version>/<artifactId>-<version>.jar
libraries:
  - com.zaxxer:HikariCP:6.3.0
  - org.xerial:sqlite-jdbc:3.50.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.10

description: 开源称号系统（Title System），支持称号购买/穿戴/展示/Buff/粒子/多语言
authors: [Henry]
website: https://github.com/

# 本插件不使用 NMS、不使用反射、不发起任何外部网络请求。
softdepend: [Vault, PlaceholderAPI, SuperTrails, PlayerParticles]

# 所有命令与权限节点均在此声明（插件不注册任何 plugin.yml 之外的隐藏命令）
commands:
  title:
    description: 称号系统主命令
    usage: /title <shop|chest|give|remove|clear|list|reload|help>
    aliases: [titles, chenghao]
    permission: title.use
    permission-message: 你没有权限使用该命令!

permissions:
  title.use:
    description: 使用 /title 命令
    default: true
  title.user:
    description: 使用玩家功能（shop / chest）
    default: true
  title.admin:
    description: 使用管理员功能（give / remove / clear / list / reload）
    default: op
  title.buy.*:
    description: 购买所有称号
    default: true
    children:
      title.buy.vip: true
      title.buy.svip: true
      title.buy.mvp: true
      title.buy.newbie: true
  title.buy.vip:
    description: 购买 VIP 称号
    default: true
  title.buy.svip:
    description: 购买 SVIP 称号
    default: true
  title.buy.mvp:
    description: 购买 MVP 称号
    default: true
  title.buy.newbie:
    description: 购买新人称号
    default: true
